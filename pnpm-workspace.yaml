# Aprobar scripts de build de dependencias nativas (pnpm v10+ los bloquea por defecto).
# sharp = optimización de imágenes; el resto son binarios de swc/eslint/next.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  sharp: true
  unrs-resolver: true

# Forzar postcss parcheado (GHSA-fxqj-rqcc-2cmp) en transitivas de next/tailwind.
overrides:
  postcss: ">=8.5.23 <9"
